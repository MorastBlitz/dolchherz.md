name: CI

on:
  push:
    branches: '**'
  pull_request:
  workflow_dispatch:

jobs:
  # Der typos-Job aus BeastVault prüft Rechtschreibung mit englischem
  # Wörterbuch. Dieses Projekt ist durchgehend deutschsprachig, und typos
  # kennt keine deutsche Sprache (locale akzeptiert nur en, en-us, en-gb,
  # en-ca, en-au). Der Job entfällt daher und wird durch die Datenprüfung
  # ersetzt.
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/Jod
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Check data
        run: npm run pruefen
